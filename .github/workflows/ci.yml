name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq git patch sed binutils squashfs-tools rename findutils xz-utils make

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Check Makefile
        run: make help

      - name: Check required directories
        run: |
          test -d assets
          test -d cobalt-patches
          test -d scripts
          test -d webapp

      - name: Check private image separation
        run: |
          if git ls-files | grep -E '\.(ipk|xz|tar|tar\.gz|tgz|img|crx)$'; then
            echo "Build images must not be tracked in the public repository."
            exit 1
          fi

          grep -F 'RF1705/YouTube-webos-images.git' Makefile
          grep -F 'youtube-official-1.1.5.tar.gz' Makefile
          python3 scripts/verify-pjtr-starter.py --help

      - name: Build injected web app
        working-directory: webapp
        run: |
          npm ci
          npm run build -- --env production --optimization-minimize

      - name: Run webapp tests
        working-directory: webapp
        run: npm test
