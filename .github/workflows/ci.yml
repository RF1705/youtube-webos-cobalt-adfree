name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aac-host-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check out Cobalt 23.lts.6 AAC adapter
        uses: actions/checkout@v5
        with:
          repository: youtube/cobalt
          ref: 007628df7bddd86e53d6d151ecd122614916223d
          path: workdir/cobalt-aac-test
          sparse-checkout: |
            starboard/shared/libfdkaac
            third_party/libfdkaac

      - name: Check out pinned FDK-AAC 2.0.3
        uses: actions/checkout@v5
        with:
          repository: mstorsjo/fdk-aac
          ref: 716f4394641d53f0d79c9ddac3fa93b03a49f278
          path: workdir/fdk-aac-test

      - name: Test loader and actual AAC decoding
        run: |
          git -C workdir/cobalt-aac-test apply --check "$GITHUB_WORKSPACE/cobalt-platform/cobalt-23.lts.6-webos-bundled-aac.patch"
          git -C workdir/cobalt-aac-test apply "$GITHUB_WORKSPACE/cobalt-platform/cobalt-23.lts.6-webos-bundled-aac.patch"
          cmake -S workdir/fdk-aac-test -B "$RUNNER_TEMP/fdk-aac-host" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DBUILD_PROGRAMS=OFF
          cmake --build "$RUNNER_TEMP/fdk-aac-host" --parallel 4
          python3 scripts/test-fdk-aac-decoder.py workdir/cobalt-aac-test \
            --library "$RUNNER_TEMP/fdk-aac-host/libfdk-aac.so"

      - name: Test AAC packaging and artifact retention
        run: python3 scripts/test-bundled-aac-package.py

  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq git patch sed binutils squashfs-tools rename findutils xz-utils make g++ libsdl2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Check Makefile
        run: make help

      - name: Check required directories
        run: |
          test -d assets
          test -d cobalt-patches
          test -d cobalt-platform
          test -d scripts
          test -d webapp

      - name: Check repository separation
        run: |
          if git ls-files | grep -E '\\.(ipk|xz|tar|tar\\.gz|tgz|img|crx)$'; then
            echo "Build artifacts must not be tracked in the public repository."
            exit 1
          fi

          python3 scripts/normalize-ipk-ownership.py --help
          python3 scripts/verify-ipk-container.py --help
          python3 scripts/test-ipk-tools.py

      - name: Run SDL wheel input regression test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I cobalt-platform/webos/arm \
            scripts/test-sdl-wheel-input.cc \
            -o /tmp/test-sdl-wheel-input
          /tmp/test-sdl-wheel-input

      - name: Build injected web app
        working-directory: webapp
        run: |
          npm ci
          npm run build -- --env production --optimization-minimize

      - name: Run webapp tests
        working-directory: webapp
        run: npm test

  webos-launch-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install launch test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libjson-c-dev pkg-config

      - name: Run webOS launch regressions
        run: bash scripts/test-webos-launch-parameters.sh

      - name: Check out pinned webOS SDL fixture
        uses: actions/checkout@v5
        with:
          repository: webosbrew/SDL-webOS
          ref: 263629dab0c89e75f9872eed66e197174952ce02
          path: workdir/sdl-launch-test
          sparse-checkout: |
            src/core/webos
            src/video/wayland

      - name: Check SDL relaunch patch
        run: |
          patch="$GITHUB_WORKSPACE/cobalt-platform/SDL-webOS-2.30.12-relaunch-sigcont.patch"
          git -C workdir/sdl-launch-test apply --check "$patch"
          git -C workdir/sdl-launch-test apply "$patch"
          git -C workdir/sdl-launch-test apply --reverse --check "$patch"
