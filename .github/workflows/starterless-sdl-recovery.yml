name: Starterless SDL recovery

on:
  push:
    branches:
      - fix/starterless-shorts-preload

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download webOS NDK
        uses: robinraju/release-downloader@v1.11
        with:
          repository: openlgtv/buildroot-nc4
          tag: webos-b17b4cc
          fileName: arm-webos-linux-gnueabi_sdk-buildroot.tar.gz
          extract: 'true'
          out-file-path: /tmp

      - name: Relocate webOS NDK
        working-directory: /tmp
        run: ./arm-webos-linux-gnueabi_sdk-buildroot/relocate-sdk.sh

      - name: Prepare patched SDL-webOS
        run: |
          git clone https://github.com/webosbrew/SDL-webOS.git /tmp/SDL-webOS
          git -C /tmp/SDL-webOS checkout 263629dab0c89e75f9872eed66e197174952ce02
          git -C /tmp/SDL-webOS apply "$GITHUB_WORKSPACE/cobalt-platform/SDL-webOS-2.30.12-relaunch-sigcont.patch"
          grep -Fq 'kill(getpid(), SIGCONT);' /tmp/SDL-webOS/src/core/webos/SDL_webos_init.c

      - name: Configure SDL-webOS
        run: |
          cmake -B /tmp/SDL-build -S /tmp/SDL-webOS \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/arm-webos-linux-gnueabi_sdk-buildroot/share/buildroot/toolchainfile.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DWEBOS=ON \
            -DSDL_OFFSCREEN=OFF \
            -DSDL_DISKAUDIO=OFF \
            -DSDL_DUMMYAUDIO=OFF \
            -DSDL_DUMMYVIDEO=OFF \
            -DSDL_KMSDRM=OFF \
            -DSDL_VENDOR_INFO='YTAF Starterless' \
            -DSDL_WEBOS_BROKEN_ABI=ON

      - name: Build and install SDL-webOS
        run: |
          cmake --build /tmp/SDL-build --config Release --parallel 4
          cmake --install /tmp/SDL-build --prefix /tmp/SDL-dist
          test -f /tmp/SDL-dist/lib/libSDL2.a
          grep -Eq '^#define SDL_WEBOS_BROKEN_ABI[[:space:]]+1$' /tmp/SDL-dist/include/SDL2/SDL_config.h
          grep -Eq '^#define SDL_VIDEO_DRIVER_WAYLAND_WEBOS[[:space:]]+1$' /tmp/SDL-dist/include/SDL2/SDL_config.h
          tar -C /tmp/SDL-dist -czf "$GITHUB_WORKSPACE/SDL2-2.30.12-webos-abi-ytaf.tar.gz" .

      - name: Upload patched SDL bundle
        uses: actions/upload-artifact@v4
        with:
          name: SDL2-2.30.12-webos-abi-ytaf
          path: SDL2-2.30.12-webos-abi-ytaf.tar.gz
          if-no-files-found: error
