name: VP9 4K Cobalt test build

on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: Existing AdFree release used as the package base
        required: true
        default: v1.2.2
        type: string
      test_version:
        description: Numeric webOS version for the test package
        required: true
        default: 1.2.104
        type: string
      build_parallel:
        description: Parallel Cobalt compiler jobs
        required: true
        default: "4"
        type: choice
        options:
          - "2"
          - "4"

permissions:
  contents: read

concurrency:
  group: vp9-4k-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Cobalt 23.lts.6 / SB13 test IPK
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate inputs and patch
        env:
          BASE_TAG: ${{ inputs.base_tag }}
          TEST_VERSION: ${{ inputs.test_version }}
        run: |
          [[ "$BASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$TEST_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -F '[YTAF] Forcing explicit VP9 SDR UHD support' \
            cobalt-patches/cobalt-23.lts.6.patch

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            findutils \
            git \
            jq \
            make \
            patch \
            rename \
            sed \
            squashfs-tools \
            xz-utils

          if ! command -v docker-compose >/dev/null 2>&1; then
            printf '%s\n' '#!/bin/sh' 'exec docker compose "$@"' |
              sudo tee /usr/local/bin/docker-compose >/dev/null
            sudo chmod +x /usr/local/bin/docker-compose
          fi

          docker-compose version

      - name: Download base AdFree package
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_TAG: ${{ inputs.base_tag }}
        run: |
          base_version="${BASE_TAG#v}"
          base_name="youtube.leanback.v4_${base_version}_arm.ipk"
          mkdir -p base-package
          gh release download "$BASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$base_name" \
            --dir base-package
          test -f "base-package/$base_name"
          echo "BASE_IPK=base-package/$base_name" >> "$GITHUB_ENV"

      - name: Prepare Cobalt source and build containers
        env:
          BUILD_PARALLEL: ${{ inputs.build_parallel }}
        run: |
          mkdir -p output workdir
          git clone --depth 1 --branch 23.lts.6 \
            https://github.com/youtube/cobalt.git \
            workdir/cobalt-23.lts.6
          git -C workdir/cobalt-23.lts.6 apply --recount \
            "$GITHUB_WORKSPACE/cobalt-patches/cobalt-23.lts.6.patch"
          touch workdir/cobalt-23.lts.6/.patched

          (
            cd workdir/cobalt-23.lts.6
            export NINJA_PARALLEL="$BUILD_PARALLEL"
            export SB_API_VERSION=13
            docker-compose build base
            docker-compose build build-base
            docker-compose build build-evergreen
          ) 2>&1 | tee output/vp9-4k-cobalt-build.log

      - name: Build patched Cobalt runtime
        env:
          BUILD_PARALLEL: ${{ inputs.build_parallel }}
        run: |
          mkdir -p output
          make cobalt-bin/23.lts.6-13/libcobalt.so \
            BUILD_COBALT_PARALLEL="$BUILD_PARALLEL" \
            2>&1 | tee -a output/vp9-4k-cobalt-build.log
          test -s cobalt-bin/23.lts.6-13/libcobalt.so

      - name: Archive patched runtime
        run: |
          make cobalt-bin/23.lts.6-13.xz
          test -s cobalt-bin/23.lts.6-13.xz

      - name: Package VP9 4K test build
        env:
          TEST_VERSION: ${{ inputs.test_version }}
        run: |
          make package \
            PACKAGE="$BASE_IPK" \
            PACKAGE_VERSION="$TEST_VERSION" \
            PACKAGE_COBALT_VERSION=23.lts.6 \
            PACKAGE_SB_API_VERSION=13 \
            PACKAGE_COBALT_ARCHIVE=cobalt-bin/23.lts.6-13.xz

          test_ipk="output/youtube.leanback.v4_${TEST_VERSION}_arm.ipk"
          test -s "$test_ipk"
          sha256sum "$test_ipk" | tee output/SHA256SUMS-vp9-4k-test.txt

      - name: Add test instructions
        env:
          TEST_VERSION: ${{ inputs.test_version }}
        run: |
          {
            echo '# VP9 4K Cobalt test build'
            echo
            echo "Package version: $TEST_VERSION"
            echo 'Cobalt: 23.lts.6 / Starboard 13'
            echo
            echo 'Test an affected VP9 video and report:'
            echo '- whether 1440p and 2160p appear;'
            echo '- whether 2160p playback starts and remains stable;'
            echo '- the codec and resolution from Stats for nerds;'
            echo '- log lines containing `[YTAF]`.'
          } > output/VP9-4K-TEST.txt

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: youtube-cobalt-vp9-4k-test-${{ inputs.test_version }}
          path: |
            output/youtube.leanback.v4_${{ inputs.test_version }}_arm.ipk
            output/SHA256SUMS-vp9-4k-test.txt
            output/VP9-4K-TEST.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload Cobalt build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: vp9-4k-cobalt-build-log
          path: output/vp9-4k-cobalt-build.log
          if-no-files-found: warn
          retention-days: 14
